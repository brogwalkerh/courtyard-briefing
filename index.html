<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Courtyard Liberty Station — Team Briefing</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400&family=DM+Serif+Display&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0f1117;
    --surface: #181a22;
    --surface-alt: #1e2130;
    --border: #2a2d3a;
    --text: #e8e6e1;
    --text-dim: #8b8d97;
    --accent: #d4a04a;
    --accent-glow: rgba(212, 160, 74, 0.15);
    --urgent: #e05555;
    --success: #4caf80;
    --info: #5b9bd5;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    height: 100%;
    overflow: hidden;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Sans', sans-serif;
    -webkit-font-smoothing: antialiased;
  }

  .app {
    display: grid;
    grid-template-columns: 300px 1fr 1fr;
    grid-template-rows: 64px 1fr;
    gap: 1px;
    height: 100vh;
    background: var(--border);
  }

  /* ─── LOADING OVERLAY ─── */
  .loading-overlay {
    position: fixed;
    inset: 0;
    background: var(--bg);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 100;
    transition: opacity 0.6s ease;
  }
  .loading-overlay.hidden { opacity: 0; pointer-events: none; }
  .loading-spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--accent);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  .loading-text {
    margin-top: 16px;
    font-size: 13px;
    color: var(--text-dim);
    letter-spacing: 1px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ─── STATUS INDICATOR ─── */
  .data-status {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.5px;
  }
  .status-dot {
    width: 6px; height: 6px;
    border-radius: 50%;
    background: var(--success);
  }
  .status-dot.offline { background: var(--urgent); }
  .status-dot.stale { background: var(--accent); }

  /* ─── TOP BAR ─── */
  .topbar {
    grid-column: 1 / -1;
    background: var(--surface);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
  }

  .topbar-left {
    display: flex;
    align-items: center;
    gap: 16px;
  }

  .logo-mark {
    width: 8px;
    height: 32px;
    background: var(--accent);
    border-radius: 2px;
  }

  .property-name {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    letter-spacing: 0.5px;
    color: var(--text);
  }

  .property-name .property-sub {
    color: var(--accent);
    font-family: 'DM Sans', sans-serif;
    font-weight: 300;
    font-size: 13px;
    margin-left: 12px;
    letter-spacing: 1px;
    text-transform: uppercase;
  }

  .topbar-right {
    display: flex;
    align-items: center;
    gap: 24px;
  }

  .clock {
    font-size: 28px;
    font-weight: 300;
    letter-spacing: 2px;
    font-variant-numeric: tabular-nums;
  }

  .shift-badge {
    padding: 6px 16px;
    border-radius: 4px;
    font-size: 12px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
  }

  .shift-1 { background: #2d1f4e; color: #b48eff; }
  .shift-2 { background: #1f3a2d; color: #6fcf97; }
  .shift-3 { background: #3a2a1f; color: #f2a85e; }

  .date-display {
    font-size: 13px;
    color: var(--text-dim);
    font-weight: 400;
    letter-spacing: 0.3px;
  }

  /* ─── LEFT SIDEBAR ─── */
  .sidebar {
    grid-row: 2 / -1;
    background: var(--surface);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  .sidebar-section {
    padding: 20px;
    border-bottom: 1px solid var(--border);
  }

  .sidebar-section:last-child {
    border-bottom: none;
    flex: 1;
    overflow-y: auto;
  }

  .section-label {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 2px;
    text-transform: uppercase;
    color: var(--accent);
    margin-bottom: 12px;
  }

  .countdown-number {
    font-family: 'DM Serif Display', serif;
    font-size: 56px;
    line-height: 1;
    color: var(--accent);
  }

  .countdown-label {
    font-size: 13px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .countdown-sub {
    font-size: 12px;
    color: var(--text-dim);
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--border);
  }

  .stats-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
  }

  .stat-card {
    background: var(--surface-alt);
    border-radius: 6px;
    padding: 12px;
    text-align: center;
  }

  .stat-value {
    font-family: 'DM Serif Display', serif;
    font-size: 28px;
    color: var(--text);
  }

  .stat-label {
    font-size: 11px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-top: 2px;
  }

  .aoa-box {
    background: var(--accent-glow);
    border: 1px solid rgba(212,160,74,0.25);
    border-radius: 8px;
    padding: 14px;
    text-align: center;
  }

  .aoa-icon { font-size: 22px; margin-bottom: 6px; }

  .aoa-text {
    font-size: 13px;
    color: var(--accent);
    font-weight: 500;
  }

  .aoa-sub {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 4px;
  }

  .weather-row {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 8px 0;
  }

  .weather-temp {
    font-family: 'DM Serif Display', serif;
    font-size: 32px;
  }

  .weather-desc { font-size: 13px; color: var(--text-dim); }
  .weather-detail { font-size: 11px; color: var(--text-dim); }

  /* ─── MAIN PANELS ─── */
  .panel {
    background: var(--surface);
    padding: 24px;
    overflow-y: auto;
  }

  .panel-header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    /* stays pinned while long lists auto-scroll */
    position: sticky;
    top: -24px;
    z-index: 1;
    margin: -24px -24px 4px;
    padding: 24px 24px 12px;
    background: var(--surface);
  }

  .panel-title {
    font-family: 'DM Serif Display', serif;
    font-size: 18px;
    color: var(--text);
  }

  .panel-count {
    font-size: 11px;
    color: var(--text-dim);
    background: var(--surface-alt);
    padding: 3px 10px;
    border-radius: 12px;
  }

  .task-item {
    display: flex;
    gap: 12px;
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    animation: fadeSlideIn 0.4s ease both;
  }

  .task-item:last-child { border-bottom: none; }

  .task-priority {
    width: 4px;
    border-radius: 2px;
    flex-shrink: 0;
    margin-top: 2px;
  }

  .priority-high { background: var(--urgent); }
  .priority-medium { background: var(--accent); }
  .priority-low { background: var(--info); }

  .task-content { flex: 1; }

  .task-title {
    font-size: 14px;
    font-weight: 500;
    line-height: 1.3;
    margin-bottom: 4px;
  }

  .task-meta { font-size: 11px; color: var(--text-dim); }

  .task-due {
    font-size: 11px;
    padding: 2px 8px;
    border-radius: 3px;
    font-weight: 500;
    white-space: nowrap;
    height: fit-content;
  }

  .due-urgent { background: rgba(224,85,85,0.15); color: var(--urgent); }
  .due-soon { background: rgba(212,160,74,0.15); color: var(--accent); }
  .due-normal { background: var(--surface-alt); color: var(--text-dim); }

  .reminder-item {
    padding: 10px 14px;
    background: var(--surface-alt);
    border-radius: 6px;
    margin-bottom: 8px;
    font-size: 13px;
    line-height: 1.5;
    border-left: 3px solid var(--border);
    animation: fadeSlideIn 0.4s ease both;
  }

  .reminder-item.highlight {
    border-left-color: var(--accent);
    background: var(--accent-glow);
  }

  .reminder-category {
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 4px;
  }

  .update-item {
    padding: 12px 0;
    border-bottom: 1px solid var(--border);
    animation: fadeSlideIn 0.4s ease both;
  }

  .update-item:last-child { border-bottom: none; }

  .update-date {
    font-size: 11px;
    color: var(--accent);
    font-weight: 500;
    margin-bottom: 4px;
  }

  .update-text {
    font-size: 13px;
    line-height: 1.5;
  }

  .update-source {
    font-size: 10px;
    color: var(--text-dim);
    margin-top: 4px;
    font-style: italic;
  }

  .shoutout-item {
    padding: 12px 14px;
    background: linear-gradient(135deg, var(--accent-glow), transparent);
    border-radius: 8px;
    margin-bottom: 8px;
    border: 1px solid rgba(212,160,74,0.12);
    animation: fadeSlideIn 0.4s ease both;
  }

  .shoutout-name {
    font-weight: 600;
    font-size: 14px;
    color: var(--accent);
    margin-bottom: 4px;
  }

  .shoutout-reason {
    font-size: 13px;
    color: var(--text-dim);
    line-height: 1.4;
  }

  .checklist-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    padding: 8px 0;
    font-size: 13px;
    line-height: 1.4;
    color: var(--text-dim);
  }

  .check-bullet {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    margin-top: 5px;
    flex-shrink: 0;
  }

  .page-dots { display: flex; gap: 6px; }

  .page-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--border);
    transition: all 0.3s ease;
  }

  .page-dot.active {
    background: var(--accent);
    width: 20px;
    border-radius: 3px;
  }

  @keyframes fadeSlideIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  ::-webkit-scrollbar { width: 4px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

  .empty-state {
    padding: 32px 0;
    text-align: center;
    font-size: 13px;
    color: var(--text-dim);
    font-style: italic;
  }

  /* ─── SMALL SCREENS (tablet portrait / phone) ─── */
  @media (max-width: 900px) {
    html, body { height: auto; overflow: auto; }
    .app {
      grid-template-columns: 1fr;
      grid-template-rows: auto;
      height: auto;
      min-height: 100vh;
    }
    .topbar {
      flex-wrap: wrap;
      gap: 8px;
      padding: 12px 16px;
    }
    .topbar-right { flex-wrap: wrap; gap: 12px; }
    .clock { font-size: 22px; }
    .sidebar { grid-row: auto; overflow: visible; }
    .sidebar-section:last-child { overflow: visible; }
    .panel { padding: 20px 16px; overflow: visible; }
    .panel-header { position: static; margin: 0 0 16px; padding: 0; }
  }
</style>
</head>
<body>

<!-- Loading overlay -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-spinner"></div>
  <div class="loading-text">Loading briefing data…</div>
</div>

<div class="app">

  <!-- TOP BAR -->
  <div class="topbar">
    <div class="topbar-left">
      <div class="logo-mark"></div>
      <div class="property-name">
        <span id="propertyName">Courtyard Liberty Station</span>

          <div class="weather-temp" id="weatherTemp">--°</div>

  <!-- MAIN PANEL LEFT -->

<script>
// ═══════════════════════════════════════════════════════════════
//  GOOGLE SHEETS CONFIGURATION
// ═══════════════════════════════════════════════════════════════
//
//  1. Create a Google Sheet with tabs named exactly:
//     tasks, reminders, updates, shoutouts, stats, weather, config
//     (config is optional — the defaults below are used without it)
//
//  2. Publish the sheet: File → Share → Publish to web → Entire document → CSV
//
//  3. Paste your Sheet ID below (the long string in the Sheet URL):
//     https://docs.google.com/spreadsheets/d/SHEET_ID_HERE/edit
//
const SHEET_ID = '1LF6KdUG191bP5q97aKfi69upgGIEa7mszWyox1Vt-aY';

// How often to re-fetch data from the sheet (milliseconds)
const FETCH_INTERVAL = 5 * 60 * 1000; // 5 minutes

// Give up on a single tab request after this long (milliseconds)
const FETCH_TIMEOUT = 15000;

// Defaults — each can be overridden from the "config" tab
const DEFAULT_CONFIG = {
  migrationDate: '2026-06-15',   // YYYY-MM-DD
  rotationInterval: 15000,       // ms between panel page flips
  propertyName: 'Courtyard Liberty Station'
};


// ═══════════════════════════════════════════════════════════════
//  SHEET COLUMN SCHEMAS (match your Google Sheet headers)
// ═══════════════════════════════════════════════════════════════
//
//  TAB: tasks
//  Columns: title | meta | due | dueClass | priority | active
//  dueClass: due-urgent | due-soon | due-normal
//  priority: high | medium | low
//  active: TRUE to show, FALSE to hide
//
//  TAB: reminders
//  Columns: category | text | highlight | active
//  highlight: TRUE | FALSE
//
//  TAB: updates
//  Columns: date | text | source | active
//  source: optional, e.g. "via Gmail" or "Manual"
//
//  TAB: shoutouts
//  Columns: name | reason | active
//
//  TAB: stats
//  Columns: key | value
//  Rows: arrivals | departures | occupancy | vips
//
//  TAB: weather
//  Columns: key | value
//  Rows: temp | description | high | low | pool
//
//  TAB: config
//  Columns: key | value
//  Rows: migrationDate | rotationInterval | propertyName
//  rotationInterval is in seconds (e.g. 15)
//
//  NOTE: if a tab name doesn't exist, Google silently returns the FIRST
//  tab instead. Each tab's header row is checked below, so a missing tab
//  is ignored rather than showing the wrong data.


// ═══════════════════════════════════════════════════════════════
//  EMPTY DATA (shown until / unless the Sheet loads)
// ═══════════════════════════════════════════════════════════════

const EMPTY = {
  tasks: [],
  reminders: [],
  updates: [],
  shoutouts: [],
  stats: { arrivals: '--', departures: '--', occupancy: '--%', vips: '--' },
  weather: { temp: '--', description: '--', high: '--', low: '--', pool: '' },
  config: { ...DEFAULT_CONFIG }
};

// ─── Shift checklists (static — these don't change often) ───
const CHECKLISTS = {
  1: [
    'Open Shuttle log, Kipsu, GXP, FOSSE',
    'Verify $300 in drawer',
    'Run MICROS poll after 2AM',
    'Run ONE BUTTON (10–15 min process)',
    'GNS: charge BAR rate for points no-shows, keep deposits',
    'Elite arrivals → assign ANY available room',
    'Prep arrivals report for AM shift',
    'Complete Act of Awe (min 1)'
  ],
  2: [
    'Review Night Audit pass-down notes',
    'Check arrivals report (F8 → TAB → F → P → A)',
    'Process departures, verify late checkouts',
    'Gold late checkout: approve after 6AM based on availability',
    'Cash log: enter NUMBER of bills/coins, save start + end',
    'Respond to Kipsu messages within 5 min',
    'Check Lodgistics for open maintenance tickets',
    'Complete Act of Awe (min 1, aim for 2)'
  ],
  3: [
    'Review AM pass-down notes',
    'Process check-ins starting at 4PM',
    'Verify elite arrivals have proper room assignments',
    'Confirm Sertifi authorizations for business arrivals',
    'Cash log: enter NUMBER of bills/coins, save start + end',
    'Close shift: F8 → TAB → F → C → S then U',
    'Send MOD pass-down email before end of shift',
    'Complete Act of Awe (min 1, aim for 2)'
  ]
};


// ═══════════════════════════════════════════════════════════════
//  DATA FETCHING ENGINE
// ═══════════════════════════════════════════════════════════════

let liveData = null;
let lastFetch = null;

function sheetURL(tab) {
  return `https://docs.google.com/spreadsheets/d/${SHEET_ID}/gviz/tq?tqx=out:csv&sheet=${encodeURIComponent(tab)}`;
}

// CSV parser that handles quoted fields, escaped quotes and newlines in cells
function parseCSVRows(csv) {
  const rows = [];
  let row = [];
  let cell = '';
  let inQuotes = false;

  for (let i = 0; i < csv.length; i++) {
    const ch = csv[i];
    if (ch === '"') {
      if (inQuotes && csv[i + 1] === '"') {
        cell += '"';
        i++;
      } else {
        inQuotes = !inQuotes;
      }
    } else if (ch === ',' && !inQuotes) {
      row.push(cell.trim());
      cell = '';
    } else if (ch === '\n' && !inQuotes) {
      row.push(cell.trim());
      if (row.some(c => c !== '')) rows.push(row);
      row = [];
      cell = '';
    } else if (ch === '\r' && !inQuotes) {
      // skip carriage return
    } else {
      cell += ch;
    }
  }
  // Last cell/row
  row.push(cell.trim());
  if (row.some(c => c !== '')) rows.push(row);

  return rows;
}

function headersOf(rows) {
  return rows.length ? rows[0].map(h => h.toLowerCase().trim()) : [];
}

// Returns null when the header row doesn't contain the expected column
// (i.e. the tab is missing and Google sent back a different one)
function csvToObjects(csv, requiredHeader) {
  const rows = parseCSVRows(csv);
  const headers = headersOf(rows);
  if (!headers.includes(requiredHeader)) return null;
  return rows.slice(1).map(row => {
    const obj = {};
    headers.forEach((h, i) => { obj[h] = row[i] || ''; });
    return obj;
  });
}

function csvToKeyValue(csv) {
  const rows = parseCSVRows(csv);
  const headers = headersOf(rows);
  if (headers[0] !== 'key') return null;
  const obj = {};
  rows.slice(1).forEach(row => {
    if (row[0]) obj[row[0].toLowerCase().trim()] = row[1] || '';
  });
  return obj;
}

function isTrue(v)  { return String(v).trim().toUpperCase() === 'TRUE'; }
function isFalse(v) { return String(v).trim().toUpperCase() === 'FALSE'; }

// "72°F", "72", "72.4 F" → "72"; anything unparseable → "--"
function cleanTemp(v) {
  const n = parseFloat(String(v).replace(/[^\d.\-]/g, ''));
  return Number.isFinite(n) ? String(Math.round(n)) : '--';
}

async function fetchTab(tab) {
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), FETCH_TIMEOUT);
  try {
    const resp = await fetch(sheetURL(tab), { signal: ctrl.signal, cache: 'no-store' });
    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    return await resp.text();
  } finally {
    clearTimeout(timer);
  }
}

function parseConfig(kv) {
  const cfg = { ...DEFAULT_CONFIG };
  if (!kv) return cfg;
  if (/^\d{4}-\d{2}-\d{2}$/.test(kv.migrationdate || '')) cfg.migrationDate = kv.migrationdate;
  const secs = parseFloat(kv.rotationinterval);
  if (secs >= 3) cfg.rotationInterval = secs * 1000;
  if (kv.propertyname) cfg.propertyName = kv.propertyname;
  return cfg;
}

// Each tab is parsed independently: a tab that fails keeps its previous value
const TABS = {
  tasks: csv => {
    const rows = csvToObjects(csv, 'title');
    return rows && rows.filter(t => t.title && !isFalse(t.active));
  },
  reminders: csv => {
    const rows = csvToObjects(csv, 'text');
    return rows && rows
      .filter(r => r.text && !isFalse(r.active))
      .map(r => ({ ...r, highlight: isTrue(r.highlight) }));
  },
  updates: csv => {
    const rows = csvToObjects(csv, 'text');
    return rows && rows.filter(u => u.text && !isFalse(u.active));
  },
  shoutouts: csv => {
    const rows = csvToObjects(csv, 'name');
    return rows && rows.filter(s => s.name && !isFalse(s.active));
  },
  stats: csv => {
    const kv = csvToKeyValue(csv);
    return kv && {
      arrivals: kv.arrivals || '--',
      departures: kv.departures || '--',
      occupancy: kv.occupancy || '--%',
      vips: kv.vips || '--'
    };
  },
  weather: csv => {
    const kv = csvToKeyValue(csv);
    return kv && {
      temp: cleanTemp(kv.temp),
      description: kv.description || '--',
      high: cleanTemp(kv.high),
      low: cleanTemp(kv.low),
      pool: kv.pool || ''
    };
  },
  // Optional — a missing config tab just means defaults
  config: csv => parseConfig(csvToKeyValue(csv))
};

async function fetchAllData() {
  const names = Object.keys(TABS);
  const results = await Promise.allSettled(names.map(fetchTab));

  const next = { ...(liveData || EMPTY) };
  let failed = 0;

  results.forEach((res, i) => {
    const name = names[i];
    if (res.status !== 'fulfilled') {
      failed++;
      console.warn(`Sheet tab "${name}" failed:`, res.reason);
      return;
    }
    const parsed = TABS[name](res.value);
    if (parsed === null) {
      console.warn(`Sheet tab "${name}" not found (header row didn't match)`);
      return;
    }
    next[name] = parsed;
  });

  if (failed === names.length) {
    // Total failure — keep whatever we had
    if (!liveData) {
      liveData = EMPTY;
      renderAll();
    }
    updateStatus(lastFetch ? 'stale' : 'offline');
    return;
  }

  const prevRotation = getData().config.rotationInterval;
  liveData = next;
  lastFetch = new Date();
  updateStatus(failed ? 'partial' : 'live');
  renderAll();
  if (liveData.config.rotationInterval !== prevRotation) startRotation();
}

function getData() {
  return liveData || EMPTY;
}

function updateStatus(state) {
  const dot = document.getElementById('statusDot');
  const text = document.getElementById('statusText');
  const time = lastFetch && lastFetch.toLocaleTimeString([], {hour:'numeric', minute:'2-digit'});
  if (state === 'live') {
    dot.className = 'status-dot';
    text.textContent = `Live · ${time}`;
  } else if (state === 'partial') {
    dot.className = 'status-dot stale';
    text.textContent = `Partial · ${time}`;
  } else if (state === 'stale') {
    dot.className = 'status-dot stale';
    text.textContent = `Stale · Last: ${time}`;
  } else {
    dot.className = 'status-dot offline';
    text.textContent = 'Offline · No data';
  }
}


// ═══════════════════════════════════════════════════════════════
//  RENDERING
// ═══════════════════════════════════════════════════════════════

// Sheet content is plain text — escape it before it goes into innerHTML
function esc(v) {
  return String(v ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}

function pick(value, allowed, fallback) {
  const v = String(value || '').trim().toLowerCase();
  return allowed.includes(v) ? v : fallback;
}

function emptyState(msg) {
  return `<div class="empty-state">${msg}</div>`;
}

function getCurrentShift() {
  const h = new Date().getHours();
  if (h >= 23 || h < 7) return 1;
  if (h >= 7 && h < 15) return 2;
  return 3;
}

function getShiftLabel(s) {
  return { 1: 'Night Audit · 11P–7A', 2: 'AM Shift · 7A–3P', 3: 'PM Shift · 3P–11P' }[s];
}

function getShiftShort(s) {
  return { 1: 'Night Audit', 2: 'AM', 3: 'PM' }[s];
}

const DAYS = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
const MONTHS = ['January','February','March','April','May','June','July','August','September','October','November','December'];

let renderedShift = null;

function updateClock() {
  const now = new Date();
  const h = now.getHours();
  const m = String(now.getMinutes()).padStart(2, '0');
  const ampm = h >= 12 ? 'PM' : 'AM';
  document.getElementById('clock').textContent = `${h % 12 || 12}:${m} ${ampm}`;
  document.getElementById('dateDisplay').textContent = `${DAYS[now.getDay()]}, ${MONTHS[now.getMonth()]} ${now.getDate()}, ${now.getFullYear()}`;

  const shift = getCurrentShift();
  const badge = document.getElementById('shiftBadge');
  badge.textContent = getShiftLabel(shift);
  badge.className = `shift-badge shift-${shift}`;

  // Swap the checklist the moment the shift changes
  if (shift !== renderedShift) renderChecklist();
}

function updateCountdown() {
  const dateStr = getData().config.migrationDate;
  const [y, mo, d] = dateStr.split('-').map(Number);
  const target = new Date(y, mo - 1, d);
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const diff = Math.round((target - today) / 86400000);

  const num = document.getElementById('countdownDays');
  const label = document.getElementById('countdownLabel');
  if (diff > 0) {
    num.textContent = diff;
    label.textContent = `day${diff === 1 ? '' : 's'} until FOSSE → Stay`;
  } else if (diff === 0) {
    num.textContent = 'Today';
    label.textContent = 'FOSSE → Stay go-live';
  } else {
    num.textContent = -diff;
    label.textContent = `day${diff === -1 ? '' : 's'} since FOSSE → Stay go-live`;
  }
  document.getElementById('countdownSub').textContent =
    `${diff >= 0 ? 'Target' : 'Went live'}: ${MONTHS[mo - 1]} ${d}, ${y} · Power of M`;
}

function renderProperty() {
  const name = getData().config.propertyName;
  document.getElementById('propertyName').textContent = name;
  document.title = `${name} — Team Briefing`;
}

function renderStats() {
  const s = getData().stats;
  document.getElementById('statsGrid').innerHTML = [
    { value: s.arrivals, label: 'Arrivals' },
    { value: s.departures, label: 'Departures' },
    { value: s.occupancy, label: 'Occupancy' },
    { value: s.vips, label: 'VIP / Elite' }
  ].map(i => `<div class="stat-card"><div class="stat-value">${esc(i.value)}</div><div class="stat-label">${i.label}</div></div>`).join('');
}

function renderWeather() {
  const w = getData().weather;
  document.getElementById('weatherTemp').textContent = `${w.temp}°F`;
  document.getElementById('weatherDesc').textContent = w.description;
  document.getElementById('weatherDetail').textContent = `H: ${w.high}° · L: ${w.low}°${w.pool ? ' · Pool: ' + w.pool.replace(/^pool:?\s*/i, '') : ''}`;
}

function renderChecklist() {
  const shift = getCurrentShift();
  renderedShift = shift;
  document.getElementById('shiftChecklistLabel').textContent = getShiftShort(shift);
  document.getElementById('shiftChecklist').innerHTML = (CHECKLISTS[shift] || []).map(item =>
    `<div class="checklist-item"><div class="check-bullet"></div><div>${esc(item)}</div></div>`
  ).join('');
}

// Panel rendering
function renderTasks() {
  const tasks = getData().tasks;
  if (!tasks.length) return emptyState('No open tasks');
  return tasks.map((t, i) => `
    <div class="task-item" style="animation-delay:${i*0.06}s">
      <div class="task-priority priority-${pick(t.priority, ['high', 'medium', 'low'], 'low')}"></div>
      <div class="task-content">
        <div class="task-title">${esc(t.title)}</div>
        <div class="task-meta">${esc(t.meta)}</div>
      </div>
      ${t.due ? `<div class="task-due ${pick(t.dueclass, ['due-urgent', 'due-soon', 'due-normal'], 'due-normal')}">${esc(t.due)}</div>` : ''}
    </div>`).join('');
}

function renderReminders() {
  const reminders = getData().reminders;
  if (!reminders.length) return emptyState('No reminders right now');
  return reminders.map((r, i) => `
    <div class="reminder-item ${r.highlight ? 'highlight' : ''}" style="animation-delay:${i*0.06}s">
      ${r.category ? `<div class="reminder-category">${esc(r.category)}</div>` : ''}
      ${esc(r.text)}
    </div>`).join('');
}

function renderUpdates() {
  const updates = getData().updates;
  if (!updates.length) return emptyState('No updates this week');
  return updates.map((u, i) => `
    <div class="update-item" style="animation-delay:${i*0.06}s">
      ${u.date ? `<div class="update-date">${esc(u.date)}</div>` : ''}
      <div class="update-text">${esc(u.text)}</div>
      ${u.source ? `<div class="update-source">${esc(u.source)}</div>` : ''}
    </div>`).join('');
}

function renderShoutouts() {
  const shoutouts = getData().shoutouts;
  if (!shoutouts.length) return emptyState('No shoutouts yet — recognize a teammate!');
  return shoutouts.map((s, i) => `
    <div class="shoutout-item" style="animation-delay:${i*0.06}s">
      <div class="shoutout-name">★ ${esc(s.name)}</div>
      <div class="shoutout-reason">${esc(s.reason)}</div>
    </div>`).join('');
}

// Rotation
const leftPages = [
  { title: 'Upcoming Tasks', render: renderTasks },
  { title: 'Reminders', render: renderReminders }
];
const rightPages = [
  { title: 'Weekly Updates', render: renderUpdates },
  { title: 'Team Shoutouts', render: renderShoutouts }
];

let leftIdx = 0, rightIdx = 0;

function dots(container, pages, active) {
  container.innerHTML = pages.map((_, i) =>
    `<div class="page-dot ${i === active ? 'active' : ''}"></div>`
  ).join('');
}

// On a wall display nobody scrolls, so long lists scroll themselves:
// hold at the top, glide to the bottom, hold, then the page flips.
const scrollAnims = {};

function autoScroll(panelId) {
  cancelAnimationFrame(scrollAnims[panelId]);
  const panel = document.getElementById(panelId);
  panel.scrollTop = 0;
  // Stacked mobile layout scrolls the whole page instead
  if (window.matchMedia('(max-width: 900px)').matches) return;

  const duration = getData().config.rotationInterval;
  const hold = Math.min(3000, duration * 0.2);
  let start = null;
  const step = ts => {
    if (start === null) start = ts;
    const max = panel.scrollHeight - panel.clientHeight;
    if (max > 0) {
      const t = Math.min(1, Math.max(0, (ts - start - hold) / (duration - hold * 2)));
      panel.scrollTop = max * t;
    }
    if (ts - start < duration) scrollAnims[panelId] = requestAnimationFrame(step);
  };
  scrollAnims[panelId] = requestAnimationFrame(step);
}

function showLeft(i) {
  leftIdx = i;
  document.getElementById('leftTitle').textContent = leftPages[i].title;
  document.getElementById('leftContent').innerHTML = leftPages[i].render();
  dots(document.getElementById('leftDots'), leftPages, i);
  autoScroll('leftPanel');
}

function showRight(i) {
  rightIdx = i;
  document.getElementById('rightTitle').textContent = rightPages[i].title;
  document.getElementById('rightContent').innerHTML = rightPages[i].render();
  dots(document.getElementById('rightDots'), rightPages, i);
  autoScroll('rightPanel');
}

let rotationTimers = [];

// (Re)start panel rotation — called at init and when rotationInterval changes
function startRotation() {
  rotationTimers.forEach(t => { clearInterval(t); clearTimeout(t); });
  const interval = getData().config.rotationInterval;
  rotationTimers = [
    setInterval(() => showLeft((leftIdx + 1) % leftPages.length), interval),
    setTimeout(() => {
      rotationTimers.push(setInterval(() => showRight((rightIdx + 1) % rightPages.length), interval));
    }, interval / 2)
  ];
}

function renderAll() {
  renderProperty();
  updateCountdown();
  renderStats();
  renderWeather();
  renderChecklist();
  showLeft(leftIdx);
  showRight(rightIdx);
}


// ═══════════════════════════════════════════════════════════════
//  INIT
// ═══════════════════════════════════════════════════════════════

async function init() {
  updateClock();
  renderAll();

  // Fetch live data
  try {
    await fetchAllData();
  } finally {
    // Hide loading screen no matter what happened
    document.getElementById('loadingOverlay').classList.add('hidden');
  }

  // Timers
  setInterval(updateClock, 1000);
  setInterval(updateCountdown, 60 * 60 * 1000);
  startRotation();

  // Re-fetch from Sheet periodically
  setInterval(fetchAllData, FETCH_INTERVAL);
}

document.addEventListener('DOMContentLoaded', init);
</script>
